# Portable source configuration. The launcher resolves paths and freezes inputs.
dataset_name: Geo-VRPTW-v1
data:
  problem_type: vrptw
  num_customers: 100
  num_charging_stations: 0
  train_dataset_path: AAAI_Dataset/dataset/vrptw/train/Cus100
  train_sample_mode: shuffle_cycle
  async_instance_prefetch: false
env:
  use_fast_env: true
  use_jit_mask: true
  normalize_reward: true
  reward_distance_scale_mode: dataset_single_customer_repair_median
  charging_mode: fixed_full
  info_level: light
model:
  embedding_dim: 256
  tanh_clipping: 15.0
  n_encode_layers: 2
  use_graph_token: true
  use_dynamic_decision_encoder: true
  dynamic_decision_heads: 4
  dynamic_decision_delta_k: false
  dynamic_decision_delta_v: false
  dynamic_decision_delta_action_key: true
  dynamic_decision_action_bias: true
  distance_injection: encoder
  use_encoder_distance_bias: true
  use_residual_edge_bias: false
  use_rdi_v2: true
  rdi_hidden_dim: 32
  use_agda_v2: true
  agda_hidden_dim: 32
  use_encoder_sdpa: true
  residual_edge_hidden_dim: 32
  use_post_charge_adapter: false
  post_charge_adapter_hidden_dim: 32
  optimize_dynamic_projections: true
  cache_static_observations: true
  use_static_rollout_cache: true
critic:
  use_decomposed_critic: false
  advantage_mode: total
training:
  online_training: false
  epochs: 80
  num_envs_per_gpu: 64
  n_traj: 50
  rollout_steps: 201
  ppo_step_chunk_size: 18
  ppo_update_epochs: 5
  num_minibatches: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.002
  learning_rate: 1.0e-05
  weight_decay: 0.0
  max_grad_norm: 1.0
  checkpoint_interval: 50
  debug: true
  debug_log_every: 1
  mixed_precision: true
  profile_timing: true
  post_init_seed: 3009
  share_ppo_sl_forward: true
  cache_expert_route_encoding: true
  latest_checkpoint_interval: 5
  lr_schedule: constant
  lr_warmup_epochs: 0
  lr_min: 1.0e-05
  entropy_initial_coef: 0.002
  entropy_final_coef: 0.002
  monitor_interval: 10
  monitor_gradient_components: true
  monitor_target_kl: 0.02
  amp_init_scale: 1024.0
  gradient_accumulation_steps: 1
  reward_norm_mode: legacy
pbrs:
  use_customer_pbrs: false
  use_repair_distance_pbrs: false
  use_feasible_ratio_pbrs: false
  use_terminal_heuristic: false
evaluation:
  eval_interval: 20
  eval_path: AAAI_Dataset/dataset/vrptw/val/Cus100
  eval_n_traj: 50
  eval_decode_mode: sample
  eval_max_steps: 201
  eval_batch_size: 32
  eval_info_level: light
  eval_save_routes: true
  eval_seed: 17003009
  eval_before_training: true
  gurobi_summary_path: AAAI_Dataset/dataset/vrptw/val/Cus100/gurobi_summary.csv
offline:
  init_checkpoint_strict: true
  strict_replay: false
  sl_coef: 0.35
  sl_clip_coef: 0.2
  only_success_route_loss: true
  sl_expert_candidate_weight: 0.6
  sl_expert_logprob_chunk_size: 4096
  use_priority_sampler: true
  priority_selection_mode: weighted
  priority_mix_rho: 0.5
  priority_alpha: 0.7
  method: sl_ppo
  init_checkpoint_path: assets/reward_norm/vrptw100_update5_epoch0300.pt
  expert_solution_path: AAAI_Dataset/dataset/vrptw/train/Cus100/expert_solutions.csv
  expert_dataset_path: AAAI_Dataset/dataset/vrptw/train/Cus100
  policy_replay_enabled: true
  share_expert_static_observations: true
  policy_replay_capacity: 3
  policy_replay_fraction: 0.25
  policy_replay_max_candidates: 16
  policy_replay_max_new_routes: 32
  policy_replay_max_relative_gap: 0.05
  policy_replay_min_edge_distance: 0.1
  policy_replay_weight: 0.1
  policy_replay_warmup_epochs: 25
  policy_replay_ramp_epochs: 75
  policy_replay_require_current_improvement: true
  policy_replay_min_current_improvement: 0.002
advantage:
  use_group_advantage: true
  group_adv_coef: 1.0
  group_adv_clip: 3.0
  group_adv_std_floor: 5.0
  group_infeasible_penalty: 10.0
  sl_include_reference_in_group_stats: true
  sl_use_memory_incumbent: true
  use_reference_advantage: true
  reference_adv_coef: 0.5
  reference_adv_rho: 1.0
  reference_adv_clip: 3.0
  reference_success_only: true
  reference_advantage_mode: absolute
  use_reference_soft_gate: false
  use_reference_memory_gate: false
  use_expert_solution_level: true
  sl_expert_candidate_weight: 0.6
  sl_candidate_clip: 2.0
  sl_candidate_std_floor: 5.0
  sl_candidate_gap_baseline: mean
  sl_candidate_gap_scale_coef: 1.0
  sl_candidate_gap_floor_ratio: 0.01
  sl_candidate_quality_gate_eta: 0.05
  sl_candidate_margin: 0.005
  sl_candidate_gate_eta: 0.05
  sl_candidate_use_current_incumbent_gate: true
  sl_candidate_use_memory_incumbent_gate: true
  sl_use_expert_candidate: true
  sl_advantage_scale_mode: relative
  sl_relative_std_floor: 0.01
optimization_profile: optimized_v2
run_name: REWARD_NORM_VRPTW100
